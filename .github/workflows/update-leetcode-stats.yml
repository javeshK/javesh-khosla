name: Update LeetCode stats

on:
  push:
    paths:
      - "leetcode/**"
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and write stats
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const path = "src/data/leetcode-stats.json";

          async function main() {
            const response = await fetch("https://leetcode-stats.tashif.codes/javeshkhosla/stats");
            if (!response.ok) throw new Error(`Stats API failed: ${response.status}`);
            const data = await response.json();

            const output = {
              lastUpdated: new Date().toISOString(),
              username: "javeshkhosla",
              totalSolved: data.totalSolved,
              totalQuestions: data.totalQuestions,
              easySolved: data.easySolved,
              totalEasy: data.totalEasy,
              mediumSolved: data.mediumSolved,
              totalMedium: data.totalMedium,
              hardSolved: data.hardSolved,
              totalHard: data.totalHard,
              acceptanceRate: data.acceptanceRate,
              ranking: data.ranking,
              topicAnalysis: data.data?.topicAnalysis ?? [],
            };

            fs.writeFileSync(path, `${JSON.stringify(output, null, 2)}\n`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Commit stats if changed
        run: |
          if git diff --quiet src/data/leetcode-stats.json; then
            echo "No stats changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/leetcode-stats.json
          git commit -m "chore: update LeetCode stats"
          git push
